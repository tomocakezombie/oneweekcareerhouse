<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKI 端末状況</title>
  <link rel="stylesheet" href="./css/embed.css">
  <style>
    .shell { padding: 8px; gap: 6px; }

    /* ---------- フロアマップ ---------- */
    .floor-wrap { overflow-x: auto; }
    .floor {
      container-type: inline-size;
      min-width: 640px;
    }
    .grid {
      display: grid;
      gap: 2px;
    }
    .seat {
      aspect-ratio: 1 / 0.8;
      border-radius: 0;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: clamp(8px, 1.45cqi, 16px);
      font-weight: 700;
      letter-spacing: -0.03em;
      user-select: none;
      cursor: default;
      transition: background 0.4s, border-color 0.4s, color 0.4s;
      border: 1px dashed var(--unknown);
      color: var(--faint);
      background: transparent;
    }
    .seat:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .seat[data-state="free"] {
      border: 1px solid var(--free-border);
      background: var(--free-bg);
      color: var(--free);
    }
    .seat[data-state="using"] {
      border: 1px solid var(--using-2);
      background: var(--using);
      color: #1a0a00;
    }

    /* 状態が変わった瞬間のフラッシュ */
    .seat.changed { animation: flash 1s ease-out; }
    @keyframes flash {
      0%   { outline: 2px solid var(--accent); outline-offset: 2px; }
      100% { outline: 2px solid transparent; outline-offset: 6px; }
    }

    .floor[data-stale="true"] .seat { filter: grayscale(0.85); opacity: 0.55; }

    /* 端末を含まない行 (通路) */
    .aisle { grid-column: 1 / -1; height: 1.6cqi; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="notice" id="notice" role="status"></div>
    <div class="floor-wrap">
      <div class="floor" id="floor" aria-label="端末配置図">
        <div class="grid" id="grid" role="grid"></div>
      </div>
    </div>
  </div>

  <script src="./js/embed-common.js"></script>
  <script src="./js/seats.js"></script>
</body>
</html>
