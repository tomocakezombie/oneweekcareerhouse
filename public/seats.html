<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKI 端末状況</title>
  <link rel="stylesheet" href="./css/embed.css">
  <style>
    /* ---------- フロアマップ ---------- */
    /* 幅 960px で組み，embed-common.js の KKI.fit で iframe に収める */
    .floor { container-type: inline-size; }
    .grid {
      display: grid;
      gap: 2px;
    }
    .seat {
      aspect-ratio: 1 / 0.8;
      border-radius: 0;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 1.4cqi;
      font-weight: 700;
      letter-spacing: -0.03em;
      user-select: none;
      cursor: default;
      transition: background-color 0.3s, border-color 0.3s, color 0.3s;
      border: 1px dashed var(--unknown);
      background: var(--light);
      color: #adb5bd;
    }
    .seat:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

    .seat[data-state="free"] {
      border: 1px solid var(--free);
      background: var(--free-bg);
      color: #1e7e34;
    }
    .seat[data-state="using"] {
      border: 1px solid var(--using);
      background: var(--using);
      color: #fff;
    }

    /* 状態が変わった瞬間のフラッシュ */
    .seat.changed { animation: flash 1s ease-out; }
    @keyframes flash {
      0%   { outline: 2px solid var(--primary); outline-offset: 2px; }
      100% { outline: 2px solid transparent; outline-offset: 5px; }
    }

    .floor[data-stale="true"] .seat { opacity: 0.45; }

    /* 端末を含まない行 (通路) */
    .aisle { grid-column: 1 / -1; height: 1.6cqi; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="notice" id="notice" role="status"></div>
    <div class="floor-wrap">
      <div class="floor" id="floor" aria-label="端末配置図">
        <div class="grid" id="grid" role="grid"></div>
      </div>
    </div>
  </div>

  <script src="./js/embed-common.js"></script>
  <script src="./js/seats.js"></script>
</body>
</html>
