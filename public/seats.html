<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKI 端末状況</title>
  <link rel="stylesheet" href="./css/embed.css">
  <style>
    /* ---------- 使用率リング ---------- */
    .summary {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .counter { text-align: right; }
    .counter .k {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .counter .v {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.1;
    }
    .counter .v small { font-size: 0.75rem; color: var(--muted); font-weight: 500; }
    .counter.using .v { color: var(--using); }
    .counter.free .v { color: var(--free); }

    .ring {
      position: relative;
      width: 64px;
      height: 64px;
      flex: none;
    }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .track { stroke: var(--panel-border); }
    .ring .bar {
      stroke: var(--level, var(--ok));
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s cubic-bezier(.2,.8,.2,1), stroke 0.4s;
      filter: drop-shadow(0 0 6px color-mix(in srgb, var(--level, var(--ok)) 60%, transparent));
    }
    .ring .pct {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.9rem;
    }
    .ring .pct small { font-size: 0.6rem; color: var(--muted); }
    .level-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--level, var(--ok));
      letter-spacing: 0.04em;
    }

    /* ---------- フロアマップ ---------- */
    .floor-wrap {
      padding: 16px;
      overflow-x: auto;
    }
    .floor {
      container-type: inline-size;
      min-width: 880px;
    }
    .grid {
      display: grid;
      gap: 0.45cqi;
    }
    .seat {
      position: relative;
      aspect-ratio: 1 / 0.82;
      border-radius: 0.7cqi;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: clamp(8px, 0.98cqi, 15px);
      font-weight: 600;
      letter-spacing: -0.02em;
      user-select: none;
      cursor: default;
      transition: background 0.5s, border-color 0.5s, box-shadow 0.5s, color 0.5s, transform 0.18s;
      border: 1px solid var(--unknown);
      color: var(--faint);
      background: transparent;
      border-style: dashed;
    }
    .seat:hover, .seat:focus-visible {
      transform: translateY(-2px) scale(1.06);
      z-index: 2;
      outline: none;
    }
    .seat:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

    .seat[data-state="free"] {
      border-style: solid;
      border-color: var(--free-border);
      background: var(--free-bg);
      color: var(--free);
    }
    .seat[data-state="using"] {
      border-style: solid;
      border-color: transparent;
      color: #fff;
      background: linear-gradient(140deg, var(--using) 0%, var(--using-2) 120%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08) inset,
        0 0.4cqi 1.4cqi -0.2cqi var(--using-glow);
      text-shadow: 0 1px 1px rgba(0,0,0,0.25);
    }

    /* 状態が変わった瞬間のフラッシュ */
    .seat.changed { animation: flash 1.1s ease-out; }
    @keyframes flash {
      0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 80%, transparent); transform: scale(1.12); }
      100% { box-shadow: 0 0 0 1.4cqi transparent; transform: scale(1); }
    }

    .floor[data-stale="true"] .seat { filter: grayscale(0.85); opacity: 0.55; }

    .aisle {
      grid-column: 1 / -1;
      height: 2.2cqi;
      display: flex;
      align-items: center;
      gap: 1cqi;
      color: var(--faint);
      font-size: 0.75cqi;
      letter-spacing: 0.4em;
      text-transform: uppercase;
    }
    .aisle::before, .aisle::after {
      content: "";
      flex: 1;
      height: 1px;
      background: repeating-linear-gradient(90deg, var(--panel-border) 0 6px, transparent 6px 12px);
    }

    /* ---------- 凡例 ---------- */
    .legend { display: flex; gap: 14px; flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i {
      width: 12px; height: 10px; border-radius: 3px; display: inline-block;
    }
    .legend .l-using { background: linear-gradient(140deg, var(--using), var(--using-2)); }
    .legend .l-free { background: var(--free-bg); border: 1px solid var(--free-border); }
    .legend .l-unknown { border: 1px dashed var(--unknown); }

    /* 狭い iframe ではカウンタを詰める */
    @media (max-width: 520px) {
      .counter .v { font-size: 1.2rem; }
      .ring { width: 54px; height: 54px; }
      .summary { gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="panel topbar">
      <div class="brand">
        <span class="live" id="live" aria-hidden="true"></span>
        <div>
          <div class="brand-title">KKI Terminals</div>
          <div class="brand-sub">キャリアハウス 端末利用状況 · ライブ</div>
        </div>
      </div>

      <div class="summary" aria-live="polite">
        <div class="counter using">
          <div class="k">使用中</div>
          <div class="v"><span id="n-using">--</span></div>
        </div>
        <div class="counter free">
          <div class="k">空き</div>
          <div class="v"><span id="n-free">--</span><small> / <span id="n-total">--</span></small></div>
        </div>
        <div class="ring" id="ring" role="img" aria-label="使用率">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="track" cx="32" cy="32" r="27" fill="none" stroke-width="6"></circle>
            <circle class="bar" id="ring-bar" cx="32" cy="32" r="27" fill="none" stroke-width="6"
                    stroke-dasharray="169.65" stroke-dashoffset="169.65"></circle>
          </svg>
          <div class="pct"><span><span id="rate">--</span><small>%</small></span></div>
        </div>
        <div class="level-label" id="level">準備中…</div>
      </div>
    </header>

    <div class="notice" id="notice" role="status"></div>

    <section class="panel floor-wrap">
      <div class="floor" id="floor" aria-label="端末配置図">
        <div class="grid" id="grid" role="grid"></div>
      </div>
    </section>

    <div class="meta">
      <div class="legend">
        <span><i class="l-using"></i>使用中</span>
        <span><i class="l-free"></i>空き</span>
        <span><i class="l-unknown"></i>状態不明</span>
      </div>
      <div>最終更新 <span class="mono" id="updated">--:--:--</span></div>
    </div>
  </div>

  <script src="./js/embed-common.js"></script>
  <script src="./js/seats.js"></script>
</body>
</html>
