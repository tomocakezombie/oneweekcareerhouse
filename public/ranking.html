<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKI 週間ランキング</title>
  <link rel="stylesheet" href="./css/embed.css">
  <style>
    /* Bootstrap 4 の .table / .table-sm 相当 */
    .ranking {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    .ranking th, .ranking td {
      padding: 0.45rem 0.6rem;
      border-top: 1px solid var(--border);
      vertical-align: middle;
    }
    .ranking thead th {
      border-top: 0;
      border-bottom: 2px solid var(--border);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      text-align: left;
      white-space: nowrap;
    }
    .ranking tbody tr:hover { background: rgba(0, 0, 0, 0.04); }

    .col-rank { width: 3.2rem; text-align: center !important; }
    .col-time { width: 1%; text-align: right !important; white-space: nowrap; }

    /* 順位 (かくかくの四角いバッジ) */
    .badge {
      display: inline-block;
      min-width: 1.9rem;
      padding: 0.2rem 0;
      font-weight: 700;
      font-size: 0.85rem;
      text-align: center;
      color: var(--dark);
      background: var(--light);
      border: 1px solid var(--border);
    }
    .r1 .badge { background: var(--gold); border-color: var(--gold); color: #fff; }
    .r2 .badge { background: var(--silver); border-color: var(--silver); color: #fff; }
    .r3 .badge { background: var(--bronze); border-color: var(--bronze); color: #fff; }
    .r1 .name, .r2 .name, .r3 .name { font-weight: 700; }

    .name {
      font-family: var(--mono);
      overflow-wrap: anywhere;
    }
    /* Bootstrap 4 の .progress 相当 */
    .progress {
      margin-top: 4px;
      height: 4px;
      background: #e9ecef;
      overflow: hidden;
    }
    .progress i {
      display: block;
      height: 100%;
      width: var(--w, 0%);
      background: var(--dark);
      transition: width 0.6s ease;
    }
    .r1 .progress i { background: var(--gold); }
    .r2 .progress i { background: var(--silver); }
    .r3 .progress i { background: var(--bronze); }

    .time { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .time small { display: block; color: var(--muted); font-size: 0.75rem; }

    tr.empty .name, tr.empty .time { color: #adb5bd; }

    .caption {
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="notice error" id="notice" role="status"></div>

    <table class="ranking">
      <thead>
        <tr>
          <th class="col-rank">順位</th>
          <th>ユーザ名</th>
          <th class="col-time">利用時間</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>

    <div class="caption">直近 1 週間の端末利用時間 · 取得 <span class="mono" id="updated">--:--:--</span></div>
  </div>

  <script src="./js/embed-common.js"></script>
  <script src="./js/ranking.js"></script>
</body>
</html>
