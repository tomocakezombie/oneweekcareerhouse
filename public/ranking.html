<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKI 週間ランキング</title>
  <link rel="stylesheet" href="./css/embed.css">
  <style>
    .trophy {
      width: 34px; height: 34px;
      border-radius: 10px;
      display: grid; place-items: center;
      background: linear-gradient(140deg, var(--gold), var(--gold-2));
      color: #3b2a00;
      box-shadow: 0 6px 18px -6px var(--gold-2);
      flex: none;
    }
    .trophy svg { width: 18px; height: 18px; }

    /* ---------- 表彰台 (1〜3 位) ---------- */
    .podium {
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      align-items: end;
      gap: 12px;
    }
    .podium-card {
      --c1: var(--silver); --c2: var(--silver-2);
      position: relative;
      overflow: hidden;
      padding: 16px 14px 14px;
      text-align: center;
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--c1) 16%, transparent), transparent 70%),
        var(--panel);
      border: 1px solid color-mix(in srgb, var(--c1) 40%, transparent);
      animation: rise 0.6s cubic-bezier(.2,.8,.2,1) both;
    }
    .podium-card::before {
      content: "";
      position: absolute;
      inset: -40% -20% auto;
      height: 80%;
      background: radial-gradient(closest-side, color-mix(in srgb, var(--c1) 30%, transparent), transparent);
      pointer-events: none;
    }
    .podium-card.r1 { --c1: var(--gold); --c2: var(--gold-2); padding-top: 26px; padding-bottom: 22px; animation-delay: 0.05s; }
    .podium-card.r2 { order: -1; animation-delay: 0.15s; }
    .podium-card.r3 { --c1: var(--bronze); --c2: var(--bronze-2); animation-delay: 0.25s; }

    .medal {
      position: relative;
      width: 44px; height: 44px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-weight: 900;
      font-size: 1.15rem;
      color: rgba(0,0,0,0.72);
      background: linear-gradient(140deg, var(--c1), var(--c2));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--c1) 22%, transparent), 0 10px 24px -8px var(--c2);
    }
    .r1 .medal { width: 54px; height: 54px; font-size: 1.4rem; }
    .crown {
      position: absolute;
      top: -15px; left: 50%;
      transform: translateX(-50%);
      width: 24px; color: var(--gold);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .podium-name {
      position: relative;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.98rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .r1 .podium-name { font-size: 1.12rem; }
    .podium-time {
      position: relative;
      margin-top: 4px;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .podium-time b { color: color-mix(in srgb, var(--c1) 55%, var(--text)); font-size: 1.05rem; }
    .r1 .podium-time b { font-size: 1.3rem; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------- 4 位以下 ---------- */
    .list {
      list-style: none;
      margin: 0;
      padding: 6px;
    }
    .row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      animation: rise 0.5s cubic-bezier(.2,.8,.2,1) both;
    }
    .row + .row { border-top: 1px solid var(--panel-border); }
    .row:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
    .rank {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }
    .who { min-width: 0; }
    .who .name {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 0.92rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .bar {
      margin-top: 6px;
      height: 5px;
      border-radius: 999px;
      background: var(--panel-border);
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      width: var(--w, 0%);
      border-radius: inherit;
      background: linear-gradient(90deg, #a78bfa, var(--accent));
      transition: width 0.9s cubic-bezier(.2,.8,.2,1);
    }
    .time {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: 0.88rem;
      text-align: right;
      white-space: nowrap;
    }
    .time small { display: block; font-size: 0.68rem; color: var(--muted); }
    .row.empty .name, .row.empty .time { color: var(--faint); }

    .empty-state {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* 狭い iframe では表彰台を縦積みに */
    @media (max-width: 460px) {
      .podium { grid-template-columns: 1fr; }
      .podium-card.r2 { order: 0; }
      .podium-card.r1 { padding-top: 22px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="panel topbar">
      <div class="brand">
        <div class="trophy" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/>
            <path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">Weekly Ranking</div>
          <div class="brand-sub">直近 7 日間の端末利用時間</div>
        </div>
      </div>
      <span class="live" id="live" aria-hidden="true"></span>
    </header>

    <div class="notice error" id="notice" role="status"></div>

    <section class="podium" id="podium" aria-label="上位 3 名"></section>

    <section class="panel">
      <ol class="list" id="list" aria-label="4 位以下"></ol>
    </section>

    <div class="meta">
      <span>直近 1 週間のローリング集計 · 5 秒ごとに更新</span>
      <span>取得 <span class="mono" id="updated">--:--:--</span></span>
    </div>
  </div>

  <script src="./js/embed-common.js"></script>
  <script src="./js/ranking.js"></script>
</body>
</html>
